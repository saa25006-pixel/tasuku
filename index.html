<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-50">
<head>

<body class="h-full text-slate-800 font-sans antialiased flex flex-col">

    <!-- Add/Edit Task Slide-over Drawer / Modal -->
    <div id="task-modal-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden flex justify-end">
        <div id="task-modal" class="bg-white w-full max-w-lg h-full shadow-2xl flex flex-col transform translate-x-full transition-transform duration-300 ease-in-out">
            <div class="p-5 border-b border-slate-100 flex items-center justify-between">
                <h2 id="task-modal-title" class="text-lg font-bold text-slate-800">新規タスク追加</h2>
                <button id="close-task-modal-btn" class="w-8 h-8 rounded-full hover:bg-slate-100 text-slate-500 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="task-form" class="p-6 flex-1 overflow-y-auto space-y-5 custom-scrollbar">
                <input type="hidden" id="task-id">
                
                <div>
                    <label for="task-title-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">タイトル <span class="text-rose-500">*</span></label>
                    <input type="text" id="task-title-input" required placeholder="タスクのタイトルを入力..." class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500 rounded-xl text-sm outline-none transition-all">
                </div>

                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="task-date-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">期限日</label>
                        <input type="date" id="task-date-input" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500 rounded-xl text-sm outline-none transition-all">
                    </div>
                    <div>
                        <label for="task-priority-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">優先度</label>
                        <select id="task-priority-input" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500 rounded-xl text-sm outline-none transition-all">

                            <option value="medium" selected>中</option>
                            <option value="high">高</option>

                </div>

                <div>
                    <label for="task-category-input" class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">カテゴリ</label>
                    <select id="task-category-input" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:bg-white focus:ring-2 focus:ring-brand-500 rounded-xl text-sm outline-none transition-all">
                        <option value="仕事">仕事</option>
                        <option value="プライベート">プライベート</option>

    <!-- Firebase SDK Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // User Provided Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDkCml611NWtNtWodLhOiQ0XurrblQitRc",
            authDomain: "tasuku-f5db2.firebaseapp.com",
            projectId: "tasuku-f5db2",
            storageBucket: "tasuku-f5db2.firebasestorage.app",
            messagingSenderId: "1000837688391",
            appId: "1:1000837688391:web:713555f1b0552ee70f5562"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State Management
        let currentUser = null;
        let tasks = [];
        let unsubscribeTasks = null;
        let currentFilter = 'all';
        let currentCategory = 'all';
        let searchQuery = '';

        // DOM Elements
        const loadingScreen = document.getElementById('loading-screen');
        const loginView = document.getElementById('login-view');
        const appView = document.getElementById('app-view');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const userAvatar = document.getElementById('user-avatar');

        const taskList = document.getElementById('task-list');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');

        const openAddTaskBtn = document.getElementById('open-add-task-btn');
        const taskModalBackdrop = document.getElementById('task-modal-backdrop');
        const taskModal = document.getElementById('task-modal');
        const closeTaskModalBtn = document.getElementById('close-task-modal-btn');
        const cancelTaskModalBtn = document.getElementById('cancel-task-modal-btn');
        const taskForm = document.getElementById('task-form');

        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userName.textContent = user.displayName || 'ユーザー';
                userEmail.textContent = user.email || '';
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || 'U')}&background=3b82f6&color=fff`;

                loginView.classList.add('hidden');
                appView.classList.remove('hidden');
                
                // Subscribe to tasks
                subscribeToTasks();
            } else {
                currentUser = null;
                if (unsubscribeTasks) unsubscribeTasks();
                tasks = [];
                appView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
            loadingScreen.classList.add('opacity-0');
            setTimeout(() => loadingScreen.classList.add('hidden'), 300);
        });

        // Google Login
        googleLoginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showToast('ログインしました', 'success');
            } catch (error) {
                console.error("Login error:", error);
                showToast('ログインに失敗しました: ' + error.message, 'error');
            }
        });

        // Logout
        logoutBtn.addEventListener('click', () => {
            showConfirmModal('ログアウト', '本当にログアウトしますか？', async () => {
                try {
                    await signOut(auth);
                    showToast('ログアウトしました', 'info');
                } catch (error) {
                    showToast('エラーが発生しました', 'error');
                }
            });
        });

        // Realtime Firestore Subscription
        function subscribeToTasks() {
            if (!currentUser) return;

            // Structure path: users/{userId}/tasks
            const tasksRef = collection(db, 'users', currentUser.uid, 'tasks');
            const q = query(tasksRef, orderBy('createdAt', 'desc'));

            unsubscribeTasks = onSnapshot(q, (snapshot) => {
                tasks = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderTasks();
                updateStats();
            }, (error) => {
                console.error("Firestore error:", error);
                showToast('データの取得中にエラーが発生しました', 'error');
            });
        }

        // Filter & Category Switchers
        document.querySelectorAll('.nav-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.nav-item').forEach(b => {
                    b.classList.remove('active', 'bg-brand-50', 'text-brand-600');
                    b.classList.add('text-slate-600');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'bg-brand-50', 'text-brand-600');
                target.classList.remove('text-slate-600');
                currentFilter = target.dataset.filter;
                renderTasks();
            });
        });

        document.querySelectorAll('.cat-item').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.cat-item').forEach(b => {
                    b.classList.remove('active', 'bg-slate-100', 'font-semibold');
                });
                const target = e.currentTarget;
                target.classList.add('active', 'bg-slate-100', 'font-semibold');
                currentCategory = target.dataset.category;
                renderTasks();
            });
        });

        // Search Input
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value.toLowerCase().trim();
            renderTasks();
        });

        // Render Tasks to UI
        function renderTasks() {
            const todayStr = new Date().toISOString().split('T')[0];

            const filtered = tasks.filter(task => {
                // Filter view
                if (currentFilter === 'pending' && task.completed) return false;
                if (currentFilter === 'completed' && !task.completed) return false;
                if (currentFilter === 'today' && task.dueDate !== todayStr) return false;

                // Category filter
                if (currentCategory !== 'all' && task.category !== currentCategory) return false;

                // Search query
                if (searchQuery) {
                    const titleMatch = task.title?.toLowerCase().includes(searchQuery);
                    const descMatch = task.description?.toLowerCase().includes(searchQuery);
                    if (!titleMatch && !descMatch) return false;
                }

                return true;
            });

            taskList.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(task => {
                    taskList.appendChild(createTaskCard(task));
                });
            }
        }

        // Create Task Card DOM Element
        function createTaskCard(task) {
            const div = document.createElement('div');
            div.className = `bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-all flex items-start justify-between gap-4 group ${task.completed ? 'opacity-65 bg-slate-50/50' : ''}`;

            const priorityBadge = {
                high: '<span class="bg-rose-50 text-rose-600 border border-rose-200 text-xs px-2.5 py-0.5 rounded-full font-medium">高</span>',
                medium: '<span class="bg-amber-50 text-amber-600 border border-amber-200 text-xs px-2.5 py-0.5 rounded-full font-medium">中</span>',
                low: '<span class="bg-blue-50 text-blue-600 border border-blue-200 text-xs px-2.5 py-0.5 rounded-full font-medium">低</span>'
            }[task.priority || 'medium'];

            div.innerHTML = `
                <div class="flex items-start gap-3 min-w-0 flex-1">
                    <button class="toggle-task-btn mt-0.5 w-6 h-6 rounded-lg border-2 ${task.completed ? 'bg-brand-500 border-brand-500 text-white' : 'border-slate-300 text-transparent hover:border-brand-500'} flex items-center justify-center transition-all flex-shrink-0">
                        <i class="fa-solid fa-check text-xs"></i>
                    </button>
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 flex-wrap">
                            <h4 class="text-base font-semibold text-slate-800 ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.title)}</h4>
                            ${priorityBadge}
                            ${task.category ? `<span class="bg-slate-100 text-slate-600 text-xs px-2.5 py-0.5 rounded-full font-medium">${escapeHtml(task.category)}</span>` : ''}
                        </div>
                        ${task.description ? `<p class="text-sm text-slate-500 mt-1 line-clamp-2 ${task.completed ? 'line-through text-slate-400' : ''}">${escapeHtml(task.description)}</p>` : ''}
                        ${task.dueDate ? `
                            <div class="flex items-center gap-1.5 text-xs text-slate-400 mt-2">
                                <i class="fa-regular fa-calendar"></i>
                                <span>${task.dueDate}</span>
                            </div>
                        ` : ''}
                    </div>
                </div>
                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button class="edit-task-btn p-2 text-slate-400 hover:text-brand-600 rounded-lg hover:bg-slate-100 transition-colors">
                        <i class="fa-regular fa-pen-to-square"></i>
                    </button>
                    <button class="delete-task-btn p-2 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-slate-100 transition-colors">
                        <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>
            `;

            // Card Event Listeners
            div.querySelector('.toggle-task-btn').addEventListener('click', () => toggleTaskComplete(task.id, !task.completed));
            div.querySelector('.edit-task-btn').addEventListener('click', () => openEditTaskModal(task));
            div.querySelector('.delete-task-btn').addEventListener('click', () => {
                showConfirmModal('タスク削除', 'このタスクを削除してもよろしいですか？', () => deleteTask(task.id));
            });

            return div;
        }

        // Update Statistics
        function updateStats() {
            const total = tasks.length;
            const completed = tasks.filter(t => t.completed).length;
            const active = total - completed;
            const todayStr = new Date().toISOString().split('T')[0];
            const todayCnt = tasks.filter(t => t.dueDate === todayStr).length;

            document.getElementById('stat-active-cnt').textContent = active;
            document.getElementById('stat-completed-cnt').textContent = completed;
            
            const rate = total > 0 ? Math.round((completed / total) * 100) : 0;
            document.getElementById('stat-rate').textContent = `${rate}%`;
            document.getElementById('stat-progress-bar').style.width = `${rate}%`;

            // Badge counts
            document.getElementById('cnt-all').textContent = total;
            document.getElementById('cnt-today').textContent = todayCnt;
            document.getElementById('cnt-pending').textContent = active;
            document.getElementById('cnt-completed').textContent = completed;
        }

        // Modal Handling
        openAddTaskBtn.addEventListener('click', () => openAddTaskModal());
        closeTaskModalBtn.addEventListener('click', closeTaskModal);
        cancelTaskModalBtn.addEventListener('click', closeTaskModal);

        function openAddTaskModal() {
            document.getElementById('task-modal-title').textContent = '新規タスク追加';
            taskForm.reset();
            document.getElementById('task-id').value = '';
            taskModalBackdrop.classList.remove('hidden');
            setTimeout(() => taskModal.classList.remove('translate-x-full'), 10);
        }

        function openEditTaskModal(task) {
            document.getElementById('task-modal-title').textContent = 'タスクの編集';
            document.getElementById('task-id').value = task.id;
            document.getElementById('task-title-input').value = task.title || '';
            document.getElementById('task-desc-input').value = task.description || '';
            document.getElementById('task-date-input').value = task.dueDate || '';
            document.getElementById('task-priority-input').value = task.priority || 'medium';
            document.getElementById('task-category-input').value = task.category || '仕事';

            taskModalBackdrop.classList.remove('hidden');
            setTimeout(() => taskModal.classList.remove('translate-x-full'), 10);
        }

        function closeTaskModal() {
            taskModal.classList.add('translate-x-full');
            setTimeout(() => taskModalBackdrop.classList.add('hidden'), 300);
        }

        // Save Task (Add or Update)
        taskForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const taskId = document.getElementById('task-id').value;
            const taskData = {
                title: document.getElementById('task-title-input').value.trim(),
                description: document.getElementById('task-desc-input').value.trim(),
                dueDate: document.getElementById('task-date-input').value,
                priority: document.getElementById('task-priority-input').value,
                category: document.getElementById('task-category-input').value,
                updatedAt: serverTimestamp()
            };

            try {
                if (taskId) {
                    // Update existing
                    const taskRef = doc(db, 'users', currentUser.uid, 'tasks', taskId);
                    await updateDoc(taskRef, taskData);
                    showToast('タスクを更新しました', 'success');
                } else {
                    // Create new
                    taskData.completed = false;
                    taskData.createdAt = serverTimestamp();
                    const tasksRef = collection(db, 'users', currentUser.uid, 'tasks');
                    await addDoc(tasksRef, taskData);
                    showToast('タスクを追加しました', 'success');
                }
                closeTaskModal();
            } catch (error) {
                console.error("Save error:", error);
                showToast('保存中にエラーが発生しました', 'error');
            }
        });

        // Toggle Task Completion
        async function toggleTaskComplete(taskId, completed) {
            if (!currentUser) return;
            try {
                const taskRef = doc(db, 'users', currentUser.uid, 'tasks', taskId);
                await updateDoc(taskRef, { completed });
            } catch (error) {
                console.error("Toggle error:", error);
                showToast('更新中にエラーが発生しました', 'error');
            }
        }

        // Delete Task
        async function deleteTask(taskId) {
            if (!currentUser) return;
            try {
                const taskRef = doc(db, 'users', currentUser.uid, 'tasks', taskId);
                await deleteDoc(taskRef);
                showToast('タスクを削除しました', 'info');
            } catch (error) {
                console.error("Delete error:", error);
                showToast('削除中にエラーが発生しました', 'error');
            }
        }

        // Toast Notification System
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgClass = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white'
            }[type];

            toast.className = `${bgClass} px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2 pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300`;
            toast.innerHTML = `
                <span>${message}</span>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Custom Confirm Modal
        let confirmActionHandler = null;
        function showConfirmModal(title, message, onConfirm) {
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            confirmActionHandler = onConfirm;

            modalBackdrop.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeConfirmModal() {
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modalBackdrop.classList.add('hidden'), 200);
        }

        modalCancelBtn.addEventListener('click', closeConfirmModal);
        modalConfirmBtn.addEventListener('click', () => {
            if (confirmActionHandler) confirmActionHandler();
            closeConfirmModal();
        });

        // Utility: HTML Escape
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[m]);
        }
    </script>
</body>
</html>
